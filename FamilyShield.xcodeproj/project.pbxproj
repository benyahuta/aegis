			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# SPEC §6.1 app_build_fresh: stamp the build day (UTC, YYYY-MM-DD) into the built Info.plist.\n# Local clock only, no network. BuildInfo.resolveBuildDay reads FSBuildDate before the\n# executable's modification date. Runs on every build so the date is always this build's.\nset -eu\nplist=\"${TARGET_BUILD_DIR}/${INFOPLIST_PATH}\"\nday=\"$(/bin/date -u +%Y-%m-%d)\"\n/usr/libexec/PlistBuddy -c \"Delete :FSBuildDate\" \"$plist\" >/dev/null 2>&1 || true\n/usr/libexec/PlistBuddy -c \"Add :FSBuildDate string ${day}\" \"$plist\"\necho \"FSBuildDate ${day} -> ${plist}\"\n";
			showEnvVarsInLog = 0;
		};
